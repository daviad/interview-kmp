# ══════════════════════════════════════════════════════════════════
# MovielyKmp - Gradle 属性配置
# 从 component-moviely 继承的稳定配置，确保 Windows + Java 25 环境兼容
# ══════════════════════════════════════════════════════════════════

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true

# Kotlin 编译执行策略：in-process = 在 Gradle Daemon 进程内直接跑 Kotlin 编译器
# 【为什么不用默认 daemon？】本机环境下 daemon 启动后无法回连（AccessDeniedException），
# 导致每个编译任务先卡几秒重试再回退。in-process 少一个进程，Windows 沙箱环境下更稳定。
kotlin.compiler.execution.strategy=in-process

# KSP 增量处理：禁用
# 【为什么禁用？】KSP1 增量缓存在多模块构建下存在不一致问题：
#   禁用增量处理 = 每次全量解析符号，确保 classpath 一致性。
#   代价是编译稍慢，但稳定性优先。
ksp.incremental=false

# KMP 专属：Kotlin/Native 编译器优化（即使无 Mac，声明 iOS target 时也需配置）
kotlin.native.cacheKind=none

# 禁止 Gradle 自动下载 JDK toolchain
# 【为什么？】KMP 插件可能尝试下载 JDK 25，但 Kotlin 2.0.20 不支持 JDK 25 的 JRT 文件系统。
# 用 JDK 21（LTS）编译，Kotlin 2.0.20 完全支持。
org.gradle.java.installations.auto-download=false
